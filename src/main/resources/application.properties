# =============================================================================
# application.properties ? Inventory Management System
# Local development configuration (H2 embedded database).
#
# Production (Render) overrides are applied by:
#   1. DatabaseUrlEnvironmentPostProcessor  ? converts DATABASE_URL at startup
#   2. application-render.properties        ? activated via SPRING_PROFILES_ACTIVE=render
# =============================================================================

spring.application.name=InventoryMangementSystem

# -----------------------------------------------------------------------------
# H2 Embedded Database  (local dev only)
# The database is persisted to a file so data survives application restarts.
# On Render this is overridden by the PostgreSQL URL from DATABASE_URL.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./inventory-db
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------------------------
# JPA / Hibernate
# 'update' keeps the schema in sync with entity changes without dropping data.
# For a clean reset delete inventory-db.mv.db and restart.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# -----------------------------------------------------------------------------
# H2 Web Console  (dev only ? disabled in production via application-render.properties)
# Access at: http://localhost:8080/h2-console
# JDBC URL:  jdbc:h2:file:./inventory-db
# Username:  sa  |  Password: (empty)
# -----------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Encoding ? force UTF-8 throughout so Tamil and other Unicode text is handled
# correctly in Thymeleaf templates and message bundles.
# -----------------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------------------------------------
# Server ? bind to all interfaces so the application is reachable inside Docker
# and on Render (where Render routes external traffic to port 8080).
# -----------------------------------------------------------------------------
server.address=0.0.0.0
