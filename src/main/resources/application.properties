# =============================================================================
# application.properties ? Inventory Management System
# Default profile: H2 embedded database (zero setup, no Docker needed).
#
# To use PostgreSQL locally, activate the postgres profile:
#   -Dspring.profiles.active=postgres
# See application-postgres.properties for connection details.
#
# Production (Render) overrides are applied by:
#   1. DatabaseUrlEnvironmentPostProcessor  ? converts DATABASE_URL at startup
#   2. application-render.properties        ? activated via SPRING_PROFILES_ACTIVE=render
# =============================================================================

spring.application.name=InventoryMangementSystem

# -----------------------------------------------------------------------------
# H2 Embedded Database (local dev only)
# Persisted to a file so data survives restarts.
# Delete inventory-db.mv.db for a clean reset.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./inventory-db
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------------------------
# JPA / Hibernate
# 'update' keeps the schema in sync with entity changes without dropping data.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

# -----------------------------------------------------------------------------
# H2 Web Console (dev only ? disabled in production)
# Access at: http://localhost:8080/h2-console
# JDBC URL:  jdbc:h2:file:./inventory-db
# Username:  sa  |  Password: (empty)
# -----------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Encoding ? force UTF-8 so Tamil and other Unicode text is handled correctly.
# -----------------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# Skip docker-compose auto-start when running tests
spring.docker.compose.skip.in-tests=true

# Bind to all interfaces (needed for Docker / Render)
server.address=0.0.0.0
