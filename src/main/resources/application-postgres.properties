# =============================================================================
# application-postgres.properties ? Local PostgreSQL via Docker Compose
#
# Spring Boot automatically starts docker-compose.yml and injects the
# datasource URL/credentials ? no manual configuration needed.
#
# Prerequisites:
#   Docker Desktop must be running (https://www.docker.com/products/docker-desktop/)
#
# Usage:
#   Just run the app with -Dspring.profiles.active=postgres
#   Spring Boot will start the postgres container for you on first launch.
# =============================================================================

# JPA / Hibernate ? let Hibernate auto-detect PostgreSQL dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console
spring.h2.console.enabled=false

# Docker Compose file location (default is ./docker-compose.yml)
spring.docker.compose.file=docker-compose.yml

# Lifecycle: start the compose services on app start, stop on app stop
spring.docker.compose.lifecycle-management=start-and-stop

# Only start the postgres service, not all services
spring.docker.compose.profiles.active=