<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register – Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
    <style>
        body { background: #f0f2f5; }
        .register-card { max-width: 440px; margin: 80px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
        .register-card .card-header { background: #4a90e2; color: #fff; border-radius: 12px 12px 0 0; text-align: center; padding: 1.5rem; }
        .register-card .card-header h4 { margin: 0; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="card register-card">
        <div class="card-header">
            <h4>🏪 Inventory System</h4>
            <small>Create a new account</small>
        </div>
        <div class="card-body p-4">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Choose a unique username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="displayName" class="form-label fw-semibold">Display Name</label>
                    <input type="text" id="displayName" name="displayName" class="form-control"
                           placeholder="Your name (optional)">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="At least 6 characters" minlength="6" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Create Account</button>
                </div>
            </form>

            <hr class="my-3">
            <p class="text-center mb-0">
                Already have an account?
                <a th:href="@{/login}" class="fw-semibold">Sign in</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
