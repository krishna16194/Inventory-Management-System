<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login – Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
    <style>
        body { background: #f0f2f5; }
        .login-card { max-width: 420px; margin: 100px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
        .login-card .card-header { background: #4a90e2; color: #fff; border-radius: 12px 12px 0 0; text-align: center; padding: 1.5rem; }
        .login-card .card-header h4 { margin: 0; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <div class="card-header">
            <h4>🏪 Inventory System</h4>
            <small>Sign in to your account</small>
        </div>
        <div class="card-body p-4">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter password" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
                </div>
            </form>

            <hr class="my-3">
            <p class="text-center mb-0">
                Don't have an account?
                <a th:href="@{/register}" class="fw-semibold">Register here</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
