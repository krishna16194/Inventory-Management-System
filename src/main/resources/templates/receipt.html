<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receipt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
    <style>
        @media print {
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h2>Receipt</h2>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Bill ID:</strong> <span th:text="${bill.id}"></span></p>
                        <p><strong>Transaction Time:</strong> <span th:text="${#temporals.format(bill.transactionTime, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${bill.location}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Customer Name:</strong> <span th:text="${bill.customerName}"></span></p>
                        <p><strong>Customer Number:</strong> <span th:text="${bill.customerNumber}"></span></p>
                    </div>
                </div>
                <hr/>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Price at Sale</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${bill.billItems}">
                            <td th:text="${item.product.name}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.priceAtSale, 1, 2)}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.priceAtSale * item.quantity, 1, 2)}"></td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-end">
                    <h3>Total: <span class="text-success" th:text="'$' + ${#numbers.formatDecimal(bill.totalAmount, 1, 2)}"></span></h3>
                </div>
            </div>
        </div>
        <div class="mt-3 no-print">
            <a href="/bill-history" class="btn btn-secondary">Back to Bill History</a>
            <button onclick="window.print()" class="btn btn-primary">Print Receipt</button>
        </div>
    </div>
</body>
</html>
