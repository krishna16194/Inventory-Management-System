<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body>
    <div class="container mt-4">
        <nav class="navbar navbar-expand-lg mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">🏪 Inventory System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/products}">Product Management</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/billing}">Billing</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <div class="nav-user-chip">
                            <div class="nav-user-avatar" th:text="${userInitial}">U</div>
                            <span th:text="${username}">User</span>
                        </div>
                        <a th:href="@{/logout}" class="btn-logout">⏻ Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Billing</h1>
        </div>

        <!-- Add Product to Bill Form -->
        <div class="card mb-4">
            <div class="card-header">
                Scan Product
            </div>
            <div class="card-body">
                <form th:action="@{/billing/add}" method="post" class="d-flex">
                    <input type="text" name="productId" class="form-control me-2" placeholder="Enter Product ID/Barcode" required autofocus />
                    <button type="submit" class="btn btn-success">Add to Bill</button>
                </form>
            </div>
        </div>

        <!-- Current Bill -->
        <div class="card">
            <div class="card-header">
                <h2>Current Bill</h2>
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart}">
                            <td th:text="${item.key.name}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.key.price, 1, 2)}"></td>
                            <td th:text="${item.value}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.key.price * item.value, 1, 2)}"></td>
                        </tr>
                    </tbody>
                </table>

                <div th:if="${not #maps.isEmpty(cart)}" class="d-flex justify-content-end align-items-center mt-3">
                    <h3 class="me-3">Total: <span class="text-success" th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}"></span></h3>
                    <a href="/billing/clear" class="btn btn-danger me-2">Clear Bill</a>
                    <form th:action="@{/billing/checkout}" method="post">
                        <button type="submit" class="btn btn-primary">Checkout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
