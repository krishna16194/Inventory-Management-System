<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
</head>
<body>
    <div class="container mt-4">
        <nav class="navbar navbar-expand-lg mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">🏪 Inventory System</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/products}">Product Management</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/billing}">Billing</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <div class="nav-user-chip">
                            <div class="nav-user-avatar" th:text="${userInitial}">U</div>
                            <span th:text="${username}">User</span>
                        </div>
                        <a th:href="@{/logout}" class="btn-logout">⏻ Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Product Management</h1>
        </div>

        <div class="card">
            <div class="card-header">
                All Products
            </div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID (Barcode)</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.name}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                            <td th:text="${p.quantity}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h2>Add New Product</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/products}" th:object="${product}" method="post">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <input type="text" class="form-control" th:field="*{id}" placeholder="ID (Barcode)" required />
                        </div>
                        <div class="col-md-3 mb-3">
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Name" required />
                        </div>
                        <div class="col-md-3 mb-3">
                            <input type="number" step="0.01" class="form-control" th:field="*{price}" placeholder="Price" required />
                        </div>
                        <div class="col-md-3 mb-3">
                            <input type="number" class="form-control" th:field="*{quantity}" placeholder="Quantity" required />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Add Product</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
