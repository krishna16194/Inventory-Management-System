# =============================================================================
# application-render.properties – Render production overrides
# Activated when the environment variable SPRING_PROFILES_ACTIVE=render
# (set automatically in render.yaml).
#
# DataSource connection properties are NOT listed here because they are
# injected programmatically by DatabaseUrlEnvironmentPostProcessor using
# the DATABASE_URL environment variable provided by Render.
# =============================================================================

# Disable the H2 web console – not needed and potentially unsafe in production
spring.h2.console.enabled=false

# Keep the schema in sync with entity changes on each deployment
spring.jpa.hibernate.ddl-auto=update

# -----------------------------------------------------------------------------
# Spring AI - Hugging Face Configuration (for FREE production hosting)
# The API key is injected from a Render Environment Variable named HUGGINGFACE_API_TOKEN.
# We are using Google's Gemma 2B model, which is free to use via the API.
# -----------------------------------------------------------------------------
spring.ai.huggingface.api-key=${HUGGINGFACE_API_TOKEN}
spring.ai.huggingface.chat.model=google/gemma-2b-it
