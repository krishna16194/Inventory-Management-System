# This file contains properties specific to the Render deployment environment

# Use PostgreSQL driver explicitly (overrides H2 from default profile)
spring.datasource.driverClassName=org.postgresql.Driver

# Use the PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 console in production
spring.h2.console.enabled=false

# The datasource URL, username, and password are provided by Render via environment variables
