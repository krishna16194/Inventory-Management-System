# This file contains properties specific to the Render deployment environment

# DataSource is configured programmatically in DataSourceConfig.java
# using the DATABASE_URL env var provided by Render

# Use the PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 console in production
spring.h2.console.enabled=false

# DDL auto
spring.jpa.hibernate.ddl-auto=update
