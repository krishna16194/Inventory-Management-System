services:
  - type: web
    name: inventory-app
    env: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: inventory-db
    plan: free
    region: frankfurt
