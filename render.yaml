services:
  - type: web
    name: inventory-app
    env: java
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "./gradlew bootJar"
    startCommand: "java -jar build/libs/Inventory-Management-System-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: inventory-db
    plan: free