// =============================================================================
// build.gradle – Inventory Management System
//
// Build tool : Gradle (wrapper included – use ./gradlew or gradlew.bat)
// Java       : 21 (Eclipse Temurin recommended)
//
// Common tasks
//   ./gradlew bootRun        – run locally on http://localhost:8080
//   ./gradlew bootJar        – produce executable JAR in build/libs/
//   ./gradlew test           – run unit tests
//   ./gradlew clean bootJar  – clean build (used in Dockerfile)
// =============================================================================

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group   = 'com.kr.bill'
version = '0.0.1-SNAPSHOT'
description = 'InventoryMangementSystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Use the Spring AI Bill of Materials (BOM) to manage all Spring AI dependency versions
// Version 0.8.1 is the latest stable GA release compatible with Spring Boot 3.2.x
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:0.8.1"
    }
}

repositories {
    mavenCentral()
    // The Spring Milestone repository is required for Spring AI 0.8.1
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // ── Core Spring Boot starters ─────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'           // Embedded Tomcat + Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'     // Server-side HTML templating
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'      // Spring Data JPA + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-security'      // Spring Security (auth disabled)
    implementation 'org.springframework.boot:spring-boot-starter-validation'    // Bean Validation (JSR-380)

    // ── Spring AI ─────────────────────────────────────────────────────────
    implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter'
    // There is no huggingface-spring-boot-starter in 0.8.1, only spring-ai-huggingface
    implementation 'org.springframework.ai:spring-ai-huggingface'


    // ── API documentation ─────────────────────────────────────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'   // Swagger UI at /swagger-ui/index.html

    // ── Excel support ─────────────────────────────────────────────────────
    implementation 'org.apache.poi:poi:5.2.3'                                   // Core Apache POI (XLS)
    implementation 'org.apache.poi:poi-ooxml:5.2.3'                             // OOXML support (XLSX)

    // ── Databases ─────────────────────────────────────────────────────────
    runtimeOnly 'com.h2database:h2'                                             // H2 embedded DB (local dev)
    runtimeOnly 'org.postgresql:postgresql'                                     // PostgreSQL driver (Render / prod)

    // ── Developer tooling ─────────────────────────────────────────────────
    compileOnly      'org.projectlombok:lombok'                                 // @Data, @Builder etc. (compile-time)
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly  'org.springframework.boot:spring-boot-devtools'            // Live reload in dev

    // ── Testing ───────────────────────────────────────────────────────────
    testImplementation    'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly       'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly       'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
